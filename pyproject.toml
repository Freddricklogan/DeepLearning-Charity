[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "charity-model"
version = "1.0.0"
description = "Binary classifier for charity funding outcomes on the Alphabet Soup dataset: tested preprocessing, a logistic-regression baseline, a Keras 3 network, measured evaluation and a generated model card."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Freddrick Logan" }]
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "keras>=3.5",
  "jax[cpu]>=0.4.30",
  "typer>=0.12",
]

[project.optional-dependencies]
app = ["streamlit>=1.38"]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "pandas-stubs>=2.2",
  "bandit>=1.7",
  "pip-audit>=2.7",
]

[project.scripts]
charity-model = "charity_model.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/charity_model"]

[tool.hatch.build]
include = ["src/charity_model/**"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "DTZ", "S", "SIM", "RUF", "T20", "PTH", "RET", "ARG"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "ARG001"]
"src/charity_model/cli.py" = ["T20"]
"streamlit_app.py" = ["T20"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
warn_unreachable = true

[[tool.mypy.overrides]]
# keras and jax ship no complete type information; sklearn's stubs are partial.
module = ["keras", "keras.*", "jax", "jax.*", "sklearn", "sklearn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["charity_model"]
omit = ["src/charity_model/cli.py"]

[tool.coverage.report]
show_missing = true
